<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A8C"/>
      <stop offset="1" stop-color="#0B1F5C"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E6FE0"/>
      <stop offset="1" stop-color="#19B6E6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9CC6FF"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(40,50)">
    <rect width="200" height="200" rx="52" fill="url(#bg)"/>
    <!-- subtle highlight -->
    <path d="M0 70 Q100 20 200 70 L200 52 Q200 0 148 0 L52 0 Q0 0 0 52 Z" fill="#fff" opacity=".07"/>
    <!-- wings (rising eagle / upward arrow) -->
    <path d="M100 118 C94 92 68 72 38 60 C56 88 76 106 100 118 Z" fill="url(#wing)"/>
    <path d="M100 118 C106 92 132 72 162 60 C144 88 124 106 100 118 Z" fill="url(#wing)"/>
    <path d="M100 56 L109 80 L100 112 L91 80 Z" fill="#fff"/>
    <!-- book -->
    <path d="M100 156 C78 142 50 140 30 147 L30 118 C50 111 78 113 100 126 Z" fill="#fff"/>
    <path d="M100 156 C122 142 150 140 170 147 L170 118 C150 111 122 113 100 126 Z" fill="#fff" opacity=".8"/>
    <!-- Bolivia dots -->
    <circle cx="80" cy="34" r="6" fill="#E53935"/>
    <circle cx="100" cy="28" r="6" fill="#FFC72C"/>
    <circle cx="120" cy="34" r="6" fill="#2EAD4F"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="280" y="170" font-size="104" font-weight="800" letter-spacing="-3" fill="#0B1F5C">Iber<tspan fill="url(#txt)">Acad</tspan></text>
    <text x="284" y="214" font-size="25" font-weight="500" letter-spacing="5" fill="#4A5A85">SISTEMA DE GESTIÓN ACADÉMICA</text>
  </g>
  <!-- flag accent -->
  <g transform="translate(284,236)">
    <rect width="60" height="6" rx="3" fill="#E53935"/>
    <rect x="66" width="60" height="6" rx="3" fill="#FFC72C"/>
    <rect x="132" width="60" height="6" rx="3" fill="#2EAD4F"/>
  </g>
</svg>
